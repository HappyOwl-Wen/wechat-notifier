# Builds, tests and packages on every push; a version tag (v0.8.1, ...) also publishes the installer as a release,
# with that version's CHANGELOG.md section as the release notes (scripts/release-notes.ps1).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build WeChatNotifier.slnx -c Release

      - name: Test
        run: dotnet test --project tests/WeChatNotifier.Tests -c Release --no-build

      - name: Package the installer
        shell: pwsh
        run: ./scripts/package.ps1

      # On every build, not only for tags: mismatched version numbers or a missing CHANGELOG.md section fail here,
      # before a release tag is pushed. The log shows the notes.
      - name: Write the release notes
        shell: pwsh
        run: |
          ./scripts/release-notes.ps1 -Tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}" -Out artifacts/release-notes.md
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          Get-Content artifacts/release-notes.md -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: WeChatNotifierSetup
          path: |
            artifacts/WeChatNotifierSetup-*.exe
            artifacts/release-notes.md
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: WeChatNotifierSetup

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" WeChatNotifierSetup-*.exe
          --repo "${{ github.repository }}"
          --title "WeChat Notifier ${{ github.ref_name }}"
          --notes-file release-notes.md
